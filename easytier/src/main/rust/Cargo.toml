[package]
name = "easytier_jni"
version = "0.1.0"
edition = "2021"

[lib]
name = "easytier"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
once_cell = "1.18.0"
log = "0.4"
android_logger = "0.13"
cidr = "0.3.1"
easytier = { path = "../../../../vendor/easytier-src/easytier", default-features = false, features = [
    "aes-gcm",
    "wireguard",
    "websocket",
    "smoltcp",
    "tun",
    "socks5",
    "magic-dns",
    "icmp-proxy",
    "management",
    "endpoint-discovery",
    "extended-services",
    "linux-netlink",
    "tcp-hole-punch",
    "tracing-log",
] }
easytier-core = { path = "../../../../vendor/easytier-src/easytier-core" }
easytier-proto = { path = "../../../../vendor/easytier-src/easytier-proto", default-features = false, features = ["api", "core"] }
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4.0"
